[project]
name = "mp-acoustic-env"
version = "0.1.0"
description = "Isolated Parselmouth/Praat acoustic feature environment (worker-only)"
requires-python = ">=3.10,<3.14"
# Resolved 2026-09-23. Parselmouth bundles Praat as a compiled extension and
# needs no GPU stack, so this environment stays tiny and CPU-only.
dependencies = [
    "praat-parselmouth==0.4.7",
    "numpy>=1.26,<3",
]
