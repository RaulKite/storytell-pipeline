[project]
name = "mp-diarization-env"
version = "0.1.0"
description = "Isolated Pyannote Community diarization environment (worker-only)"
requires-python = ">=3.10,<3.14"
# Resolved 2026-09-23. pyannote.audio 4.0.7 needs torch>=2.8; the same cu126
# wheel train as the WhisperX environment keeps driver (12.5) compatibility.
dependencies = [
    "pyannote.audio==4.0.7",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    # torchcodec ships per-torch builds; the latest release targets a newer torch
    # and fails to load (libnvrtc.so.13). Pin the release built for torch 2.8.
    "torchcodec==0.7.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
