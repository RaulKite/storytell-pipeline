# Multimodal video-processing pipeline — example configuration.
#
# Copy to config/config.local.yaml and adjust the machine-specific values.
# config.local.yaml is git-ignored because it may carry credentials.
#
# Environment-variable interpolation is supported anywhere as ${VAR} or
# ${VAR:-default}; that is the recommended way to keep secrets out of the file.

input:
  directory: /data/videos
  recursive: false
  extensions:
    - .mp4
    - .mov
    - .mkv
    - .avi
    - .webm

output:
  directory: /data/processed
  # temp_directory: /data/tmp     # defaults to the OS temp directory

execution:
  mode: sequential               # only 'sequential': one GPU, one stage at a time
  gpu: 0
  stop_on_video_error: false     # keep going after a video fails
  keep_temp_files: false

ffmpeg:
  executable: ffmpeg
  ffprobe: ffprobe

whisperx:
  enabled: true
  uv_project: environments/whisperx
  worker: workers/whisperx_worker.py
  model: large-v3
  language: auto                 # 'auto' lets Whisper detect per video
  device: cuda
  device_index: 0
  compute_type: float16
  batch_size: auto               # scales with VRAM: 16 on a 24 GB card
  beam_size: 5
  vad_method: pyannote           # pyannote | silero (VAD is always applied)
  vad_merge_chunk_seconds: 30
  # align_model: null            # override the per-language wav2vec2 alignment model
  python_version: "3.12"

diarization:
  enabled: true
  uv_project: environments/diarization
  worker: workers/diarization_worker.py
  provider: pyannote
  pipeline: pyannote/speaker-diarization-community-1
  hf_token_env: HF_TOKEN         # read from the environment, never from this file
  device: cuda
  device_index: 0
  # Community-1 also returns an *exclusive* timeline (one speaker per instant);
  # preferring it makes transcript/speaker reconciliation well-defined.
  use_exclusive_diarization_for_alignment: true
  # min_speakers: 1
  # max_speakers: 8
  # num_speakers: 2              # set only when the count is genuinely known
  python_version: "3.12"

# A second, independent diarizer, so the two engines can be compared on the same corpus.
# It writes speech/speaker_turns_nemotron.parquet and never touches speaker_turns.parquet;
# speaker assignment still uses pyannote, so turning this on changes no existing label.
diarization_nemotron:
  enabled: false                 # off: needs its own uv env and a model download
  uv_project: environments/diarization_nemotron
  worker: workers/nemotron_diarization_worker.py
  model: nvidia/Nemotron-3-Diarization
  hf_token_env: HF_TOKEN         # optional: this model is NOT gated, no EULA to accept
  device: cuda
  device_index: 0
  max_speakers: 8                # the model emits exactly 8 channels; it cannot make more
  threshold: 0.5                 # frame probability that becomes a segment; lower = more,
                                 # shorter segments
  fallback_to_cpu: true          # false: refuse to run without a GPU instead of crawling
  # timeout_seconds: 600
  python_version: "3.12"

translation:
  enabled: true
  provider: openai-compatible    # openai-compatible | mock (offline testing)
  base_url: http://LITELLM_HOST:PORT/v1
  # Prefer the environment variable over a literal key:
  api_key: ${LITELLM_API_KEY:-}
  model: claude-sonnet-4-5
  temperature: 0.0
  timeout_seconds: 120
  max_retries: 3
  backoff_base_seconds: 1.0
  batch_size: 10                 # segments per request
  context_segments: 2            # neighbouring segments sent as context only
  prompt_version: v1
  # max_output_tokens: 4000
  cache: true                    # completed batches are reused across runs
  # extra_body: {}               # gateway-specific request fields

spacy:
  enabled: true
  uv_project: environments/spacy
  worker: workers/spacy_worker.py
  process_source: true
  process_english: true
  english_model: en_core_web_lg
  # Official spaCy pipelines per detected language. Only installed models are
  # used; a missing model falls back to the family, then to `fallback_model`.
  source_models:
    en: en_core_web_lg
    es: es_dep_news_trf
    de: de_dep_news_trf
    fr: fr_dep_news_trf
    it: it_core_news_lg
    pt: pt_core_news_lg
    nl: nl_core_news_lg
    ca: ca_core_news_lg
    da: da_core_news_lg
    el: el_core_news_lg
    fi: fi_core_news_lg
    hr: hr_core_news_lg
    ja: ja_core_news_trf
    ko: ko_core_news_lg
    "no": nb_core_news_lg
    pl: pl_core_news_lg
    pt-br: pt_core_news_lg
    ro: ro_core_news_lg
    ru: ru_core_news_lg
    sv: sv_core_news_lg
    zh: zh_core_web_trf
  # 'blank' keeps tokenisation + sentence boundaries for any language, with the
  # reduced capability set recorded in provenance instead of silently assumed.
  fallback_model: blank
  # WhisperX grades its own auto-detection (low = short audio or probability < 0.5).
  # true keeps today's behaviour and logs a warning; false refuses a full linguistic
  # layer on a low-confidence detection and demotes the source variant to blank.
  trust_low_language_detection: true
  max_length: 1000000
  python_version: "3.12"

acoustic:
  enabled: true
  uv_project: environments/acoustic
  worker: workers/acoustic_worker.py
  backend: parselmouth
  # Frame step: 10 ms matches Praat's default pitch analysis granularity and
  # keeps an hour-long recording near 360k frames.
  time_step: 0.01
  # 75–500 Hz covers adult male and female speech; raise the floor for
  # child/voice-over material, lower the ceiling for very low voices.
  pitch_floor: 75
  pitch_ceiling: 500
  number_of_formants: 5          # F1-F3 are reported, 5 tracks improve F1/F2 stability
  formant_ceiling: 5500          # formants above this are treated as tracker error
  # null = derive pauses from voicing. Set e.g. -35.0 to use an intensity gate,
  # which distinguishes quiet-but-voiced background from a real pause.
  silence_threshold_db: null
  minimum_pause_duration: 0.2
  chunk_seconds: 120             # bounds Praat object size / memory
  python_version: "3.12"

openpose:
  enabled: true
  root: /opt/openpose
  # 'auto' searches <root>/build/examples/openpose/openpose.bin and <root>/models.
  executable: auto
  model_folder: auto
  gpu: 0
  body:
    enabled: true
    model: BODY_25
  hands:
    enabled: true
  face:
    enabled: true
  # Keeps RAM flat on long recordings at a modest throughput cost.
  disable_multi_thread: true
  # Ask OpenPose to render its own skeleton images (body + hands + face) into
  # pose/raw_images, one file per processed frame. Off by default, and turning it on
  # is a deliberate decision: both keys below are part of the openpose stage
  # fingerprint, so enabling this invalidates every pose dataset on disk and re-runs
  # OpenPose -- the slowest stage here -- over all of them.
  # write_images: false
  # Longest rendered side in pixels. OpenPose's own default (--output_resolution
  # -1x-1) renders at FULL input resolution: at 25 fps a 4-minute clip is 6000
  # images, and that is the difference between hundreds of MB and several GB per
  # video. Leave it null only when you want the frames at source size; the stage logs
  # the warning once per run when you do. 640 is a sane starting point for a clip
  # whose purpose is showing a pose, not inspecting a frame.
  # image_max_side: 640
  # timeout_seconds: null        # kill a wedged run after N seconds
  # extra_args: []               # e.g. ["--hand_size", "1.0"]

# Active speaker detection (TalkNet-ASD): which visible face is producing audio.
# Needs a TalkNet-ASD checkout and its own uv environment:
#   git clone https://github.com/RaulKite/TalkNet-ASD /path/to/TalkNet-ASD
#   (cd environments/activespeaker && uv sync --python 3.12)
# Disabled by default here because the checkout is external to this repository;
# when talknet_root is unset the stage reports a skipped reason naming the setting.
activespeaker:
  enabled: false
  uv_project: environments/activespeaker
  worker: workers/activespeaker_worker.py
  # talknet_root: /path/to/TalkNet-ASD
  # TalkNet downloads its two checkpoints into its own working directory. Point
  # this at a directory holding pretrain_TalkSet.model and sfd_face.pth to keep the
  # checkout read-only (or to avoid re-downloading ~150 MB per machine).
  # weights_dir: /path/to/talknet-weights
  device: auto            # auto | cuda | cpu
  device_index: 0
  # TalkNet scores are unbounded logits; the upstream convention treats 0 as the
  # speaking boundary. Raise it to demand more confidence.
  speaker_threshold: 0.0
  # Centered smoothing window in 25 FPS frames, clipped at scene cuts so a talk-head
  # never averages across a cut. Must be a positive odd integer.
  score_window: 5
  # A challenger face must beat the current one by switch_margin for switch_frames
  # consecutive frames before it takes over. This is what stops the label flickering
  # between two faces whose scores are within noise.
  switch_margin: 0.5
  switch_frames: 3
  # timeout_seconds: null
  # extra_args: []

# Person detection + tracking (Ultralytics YOLO): how many distinct people appear, and when
# each is on screen. Needs its own uv environment -- ultralytics pulls a torch build of its
# own and would fight the whisperx/diarization/activespeaker pins if installed beside them:
#   (cd environments/persons && uv sync --python 3.12)
#
# Off by default, like the other optional GPU stages: a fresh clone is not asked to sync a
# sixth torch environment it did not ask for, and the corpus completes without it (the stage
# reports a skip reason naming the setting).
#
# The output has its OWN ID NAMESPACE. `person_id` is a YOLO/ByteTracker body-track id; the
# `track_id` in speaker/active_speaker_*.parquet is a TalkNet FACE-track id. Both are small
# integers starting near zero, so joining them produces a result that looks reasonable and
# means nothing. They are also different kinds of thing: a person id can span a frame where
# the face is turned away, and one talking head can produce several person ids across a cut.
persons:
  enabled: false
  uv_project: environments/persons
  worker: workers/persons_worker.py
  # Checkpoint name, resolved under weights_dir when set and otherwise downloaded by
  # ultralytics on first use.
  #
  # yolo11n vs yolo11s, measured on this machine (RTX 4090, torch 2.8.0+cu126) over the five
  # real clips with everything else at these defaults. "ids" is distinct person_id; "frag" is
  # ids seen in <=2 frames, which is the count that says a tracker lost somebody:
  #   clip           n: ids/frag    s: ids/frag
  #   kabc                3 / 0          3 / 0
  #   cnn                 4 / 0          4 / 0
  #   la1                 8 / 2          9 / 2
  #   person_demo        75 / 13        58 / 10
  #   pipeline_demo       0 / 0          0 / 0
  # Speed was WITHIN NOISE, not a win: 92 vs 93, 91 vs 88, 136 vs 134, 112 vs 112, 154 vs 156
  # fps (elapsed includes model load). Two claims are therefore NOT made here -- n is not
  # faster than s on these clips, and n does not fragment less on the hard clip. What the
  # numbers do support is the reason n is the default: it is 5.4 MB against 18 MB to download
  # and store, and on the two clips where the answer is unambiguous (a two-shot and a four
  # panel) the two checkpoints agree exactly, so nothing is bought back there by the bigger
  # model. The hard clip disagrees in BOTH directions (8 vs 9, 75 vs 58), which is the honest
  # finding: on a busy, cut-heavy shot the person count is a property of the tracker's
  # association as much as of the people present. Read `frame_count` before believing any
  # headline count from a clip like that -- and read the `tracker` note below, which moves the
  # answer far more than this choice does.
  model: yolo11n.pt
  # Same idea as activespeaker.weights_dir, and needed for the same reason plus one:
  # ultralytics keeps its own weights_dir in a user-level settings file and it is a RELATIVE
  # path ("weights"), so it is not governed by this file at all. Set it for a hermetic run;
  # leave it unset to accept the download (yolo11n.pt is 5.4 MB, yolo11s.pt is 18 MB). The
  # worker records the path it used AND the file's sha256, because a person count is only
  # interpretable against the model that produced it.
  # weights_dir: /path/to/yolo-weights
  device: auto            # auto | cuda | cpu
  device_index: 0
  # The association algorithm, i.e. how ids survive a frame. bytetrack needs only `lap`
  # (pinned in the environment); botsort/tracktrack add camera-motion compensation and can
  # pull a re-ID checkpoint on first use. It is in the stage fingerprint, so switching it
  # invalidates every person table rather than redefining the counts quietly.
  #
  # READ THIS BEFORE TREATING A PERSON COUNT AS A FACT ABOUT THE CLIP. This setting moves the
  # answer far more than the checkpoint does. Measured on the same five clips, same weights
  # (yolo11n), same imgsz:
  #   clip           bytetrack conf=0.25   bytetrack conf=0.10   tracktrack conf=0.10
  #   kabc                   3                     3                        2
  #   cnn                    4                     4                        4
  #   la1                    8                     8                        6
  #   person_demo           75                    71                        8
  #   pipeline_demo          0                     0                        0
  # Same video, same detector, same frames. "How many people appear in person_demo" is 75 or
  # 8 depending on a config string, because on a busy, cut-heavy shot an id is a claim about
  # the tracker's association, not about a person. TrackTrack reaches 8 by merging aggressively
  # (its new_track_thresh is 0.7 against bytetrack's 0.25) and it is not simply "more right":
  # it also reports only 6 ids and at most 2 people on screen for la1, where bytetrack reports 8
  # and 3, and it never sees more than 7 people at once on person_demo against bytetrack's 14.
  # Fewer, more durable ids is a defensible target; silently counting half the on-screen crowd
  # is not, and nothing in the table says which of the two happened unless the tracker is
  # recorded -- which it is.
  #
  # bytetrack is the default here for two reasons that are about the pipeline, not about
  # accuracy: its config file needs no re-ID weights and no camera-motion compensation, so a
  # run cannot silently depend on a download nobody asked for; and it fragments rather than
  # merges, which leaves the evidence (per-id frame_count, longest_gap_seconds) for a reader
  # to decide what to merge. A merged 8 has nothing left to inspect. `frame_count` and
  # `longest_gap_seconds` exist so that a count like 75 can be read as "five people and
  # seventy moments of the tracker losing someone" -- read them before quoting the number.
  #
  # The version's own default is tracktrack.yaml, so an operator who removes this key does not
  # get bytetrack; the tracker CONFIG actually handed to the library is recorded in the raw
  # document, which is what a later reader compares.
  tracker: bytetrack
  # Person detections at or below this confidence are dropped. Lower it to keep distant or
  # partly occluded people and expect more fragmented ids in return -- measured on
  # person_demo: conf 0.25 finds 75 ids of which 13 last <=2 frames, conf 0.10 finds 71 of
  # which 8 do. Note that ultralytics' track() OVERRIDES this to 0.1 when it is not passed,
  # so it is forwarded explicitly; a stage that omitted it would silently report the counts a
  # 0.1 threshold produced.
  conf: 0.25
  # COCO class ids. 0 is `person`; anything else stops being a persons table.
  classes: [0]
  imgsz: 640                # network input side in px; costs speed ~quadratically
  # timeout_seconds: null   # no default: a 4-hour recording is 720k frames and a guessed
                            # ceiling would fail a legitimate long run
  # extra_args: []

# Audio/visual agreement (T13 + T20): fuse a diarizer's turns with the per-frame active
# speaker table. Pure python -- no GPU, no extra uv environment -- so it costs a re-read
# of two Parquet files. Its output is a SECOND diarization result beside the existing ones:
# speaker_turns.parquet and every artifact built on it keep their meaning.
#
# The point is the disagreement, not a better label. A diarizer answers *when does a voice
# speak*; activespeaker answers *which visible face is talking at 25 FPS*. They disagree on
# an off-screen narrator, a cutaway, two faces with one voice, and a mouth that moves while
# silent -- so each fused row carries an explicit agreement state instead of one flattened
# speaker label. Read `agreement` and `agreement_detail` first.
speaker_fusion:
  enabled: true
  # Which turn tables to fuse. Each selected engine writes its own file
  # (speaker/fusion_<engine>.parquet) because pyannote's SPEAKER_00 and Nemotron's
  # speaker_0 are unrelated id spaces and must never be joined. Selecting nemotron without
  # diarization_nemotron.enabled is harmless: that engine is skipped with a logged reason.
  engines: [pyannote]
  # Share of the winning track's frames *inside the turn* that must be flagged active for a
  # face_matched verdict. Raise it to require a sustained speaker; 1.0 allows no gaps.
  min_active_ratio: 0.5
  # Frames a track must be active on before it counts as evidence. One frame is a sighting,
  # not a speaker, however good its ratio looks.
  min_face_frames: 2

logging:
  level: INFO
  console: true
  # Seconds between terminal progress refreshes for long-running stages.
  progress_interval_seconds: 10
