[project]
name = "multimodal-pipeline"
version = "0.1.0"
description = "Sequential multimodal video-processing pipeline (WhisperX, Pyannote, LiteLLM, spaCy, Parselmouth, OpenPose)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12",
    "rich>=13.7",
    "pyarrow>=16",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.scripts]
multimodal-pipeline = "multimodal_pipeline.cli:app_main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external tools, GPU, models or network",
]
addopts = "-m 'not integration'"
